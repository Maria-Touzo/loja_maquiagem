{% extends 'base.html' %}

{% block title %}Categorias | Glow & Glam{% endblock %}

{% block conteudo %}
<h1 class="page-title">Categorias de Produtos</h1>

<div class="category-grid">
    {% for categoria in categorias %}
    <a href="{{ url_for('catalogo', categoria=categoria.id_categoria) }}" class="category-card">
        <h3>{{ categoria.nome_categoria }}</h3>
    </a>
    {% endfor %}
</div>

{% endblock %}
