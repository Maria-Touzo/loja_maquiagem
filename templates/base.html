<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Loja de Maquiagem{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/src/styles/index.css">
</head>
<body>

    <header class="header">
        <nav class="nav-container">
            <a href="{{ url_for('index') }}" class="logo">
                <h2>Glow <span>&</span> Glam</h2>
            </a>
            <ul class="nav-menu">
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('catalogo') }}">Catálogo</a></li>
                <li><a href="{{ url_for('categorias') }}">Categorias</a></li>
                
                {% if session.get('usuario_id') %}
                    <li><a href="{{ url_for('logout') }}" class="btn-nav btn-logout">Sair</a></li>
                {% else %}
                    <li><a href="{{ url_for('login') }}" class="btn-nav btn-login">Login</a></li>
                    <li><a href="{{ url_for('cadastro') }}" class="btn-nav btn-cadastro">Cadastro</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main class="main-content">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Glow & Glam Beauty. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
