<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - G Makeup</title>
    <link rel="stylesheet" href="/static/src/styles/index.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">G MAKEUP</a></div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Início</a></li>
                <li><a href="index.html#catalogo" class="nav-link">Catálogo</a></li>
                <li><a href="carrinho.html" class="nav-link active">Carrinho</a></li>
                <li><span class="user-status">Olá, Usuário</span></li>
                <li><a href="#" class="nav-link">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Meu Carrinho de Compras</h2>

        <!-- Tabela do Carrinho -->
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Preço Unitário</th>
                    <th>Quantidade</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                <!-- Exemplo de item adicionado -->
                <tr>
                    <td>
                        <div class="cart-item-info">
                            <img src="https://via.placeholder.com/60" alt="Batom">
                            <span>Batom Matte Vermelho</span>
                        </div>
                    </td>
                    <td>R$ 29,90</td>
                    <td>1</td>
                    <td>
                        <button class="btn-remove">Remover</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 G Makeup - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
