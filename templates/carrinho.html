<!-- Fundo escuro semi-transparente para dar destaque ao carrinho -->
<div id="carrinho-overlay" class="carrinho-overlay"></div>

<!-- Painel Lateral do Carrinho (Drawer) -->
<aside id="carrinho-lateral" class="carrinho-lateral">
    
    <!-- Cabeçalho do Carrinho -->
    <div class="carrinho-header">
        <h2>Seu Carrinho</h2>
        <button type="button" id="btn-fechar-carrinho" class="btn-fechar" aria-label="Fechar carrinho">&times;</button>
    </div>

  
    <div class="carrinho-body">
        
       
        <div class="carrinho-itens">
            
           
            <div class="carrinho-item">
                <img src="static/img/batom_red.jpg" alt="Batom Vermelho" class="item-img">
                
                <div class="item-detalhes">
                    <h4 class="item-titulo">Batom Vermelho</h4>
                    <p class="item-preco">R$ 10,00</p>
                    
                    <div class="item-qtd-controles">
                        <button type="button" class="btn-qtd">-</button>
                        <span class="item-qtd">1</span>
                        <button type="button" class="btn-qtd">+</button>
                    </div>
                </div>

                <button type="button" class="btn-remover" title="Remover item">&times;</button>
            </div>

        </div>

       
        <div class="carrinho-vazio" style="display: none;">
            <p>Seu carrinho está vazio no momento.</p>
        </div>

    </div>


    <div class="carrinho-footer">
        <div class="carrinho-subtotal">
            <span>Subtotal:</span>
            <strong id="carrinho-total-valor">R$ 10,00</strong>
        </div>
        
        <div class="carrinho-acoes">
            <a href="/checkout" class="btn btn-finalizar">Finalizar Compra</a>
        </div>
    </div>

</aside>
