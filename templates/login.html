<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Maquiagem - Login</title>
    <link rel="stylesheet" href="/static/src/styles/login.css">
</head>
<body>

    <header class="header">
        <h2 class="header__title">Login</h2>
    </header>

    <main class="login-container">
        <h1 class="login-container__title">Acessar Conta</h1>

        <form action="/login" method="POST" class="login-form">
            <div class="form-group">
                <label for="email" class="form-group__label">E-mail:</label>
                <input type="email" id="email" name="email" class="form-group__input" required>
            </div>

            <div class="form-group">
                <label for="senha" class="form-group__label">Senha:</label>
                <input type="password" id="senha" name="senha" class="form-group__input" required>
            </div>

            <button type="submit" class="login-form__button">Entrar</button>
        </form>
    </main>

</body>
</html>
