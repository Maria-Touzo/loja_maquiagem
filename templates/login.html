{% extends 'base.html' %}

{% block title %}Acessar Conta | Glow & Glam{% endblock %}

{% block conteudo %}
<div class="form-container">
    <h1 class="page-title">Acessar Conta</h1>

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn" style="margin-top: 1rem;">Entrar</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Ainda não tem conta? <a href="{{ url_for('cadastro') }}" style="color: var(--primary); font-weight: 600;">Cadastre-se</a>
    </p>
</div>
{% endblock %}
